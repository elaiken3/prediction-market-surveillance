# Off-box AUTO-RECOVERY for the collector.
#
# marts-freshness.yml ALERTS when S3 goes stale. This workflow ACTS: if the
# published marts are stale past STALE_MINUTES and the EC2 instance is *running*
# (wedged, not a deliberate stop), it STOP/STARTS the box. It does NOT reboot:
# the recurring failure is a lost network route (CLAUDE.md s9), and reboots do
# NOT clear it -- only a stop/start (which moves the instance to fresh hardware
# and re-runs DHCP) does. It keys off S3 freshness of the real artifact because
# that is the one signal that has caught every outage.
#
# Anti-loop cooldown: a stop/start resets the instance LaunchTime, so we only
# act when the box has been running (since its last start) for at least
# COOLDOWN_MINUTES. After a recovery the box gets that long to boot and publish
# before another attempt, which is what stops the reboot-loop that spammed us
# and power-cycled the box every cycle.
#
# Safe during deliberate cost-stops: a stopped instance is skipped (we only
# recover a running box; we never start a box someone stopped on purpose).
#
# SETUP (one-time): repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for
# an IAM user in the box's account (551504153614) with ONLY:
#   { "Version": "2012-10-17", "Statement": [
#     { "Effect": "Allow",
#       "Action": ["ec2:StopInstances", "ec2:StartInstances"],
#       "Resource": "arn:aws:ec2:us-east-1:551504153614:instance/i-05de8e049933efea0" },
#     { "Effect": "Allow", "Action": "ec2:DescribeInstances", "Resource": "*" } ] }
# (DescribeInstances has no resource-level scoping, hence "*".) Optional
# MARTS_ALERT_SLACK_WEBHOOK posts when a recovery happens. A manually-disabled
# workflow stays disabled across pushes -- re-enable it in the Actions UI once
# the IAM policy is updated.
name: marts-autorecover

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (scheduled runs can lag under load)
  workflow_dispatch: {}        # manual run to test

concurrency:
  group: marts-autorecover
  cancel-in-progress: false

env:
  MARTS_BASE_URL: "https://pms-marts-elaiken3.s3.us-east-1.amazonaws.com/marts"
  CANARY_MART: "fct_ingest_summary.parquet"
  STALE_MINUTES: "45"          # 3 missed 15-min publish cycles = confidently wedged
  COOLDOWN_MINUTES: "45"       # min uptime since last start before acting again (anti-loop)
  INSTANCE_ID: "i-05de8e049933efea0"
  AWS_DEFAULT_REGION: "us-east-1"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Stop/start the collector if marts are stale and it is wedged
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MARTS_ALERT_SLACK_WEBHOOK: ${{ secrets.MARTS_ALERT_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::AWS creds not set. Add AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo secrets for account 551504153614 (see header)."
            exit 1
          fi

          url="${MARTS_BASE_URL}/${CANARY_MART}"
          last_modified="$(curl -sSI "$url" | grep -i '^last-modified:' | sed 's/^[Ll]ast-[Mm]odified:[[:space:]]*//' | tr -d '\r')"
          if [ -z "$last_modified" ]; then
            echo "::warning::No Last-Modified from $url; not acting on an ambiguous signal."
            exit 0
          fi
          age_min=$(( ( $(date +%s) - $(date -d "$last_modified" +%s) ) / 60 ))
          echo "marts age: ${age_min} min (stale threshold ${STALE_MINUTES} min)"
          if [ "$age_min" -le "$STALE_MINUTES" ]; then
            echo "fresh enough; no action."
            exit 0
          fi

          # Instance state + how long it has run since its last start.
          read -r state launch < <(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].[State.Name,LaunchTime]' --output text)
          echo "instance ${INSTANCE_ID}: state=${state} launched=${launch}"

          if [ "$state" != "running" ]; then
            echo "::warning::marts stale ${age_min} min but instance is '${state}', not running -> skip (deliberate stop)."
            exit 0
          fi

          up_min=$(( ( $(date +%s) - $(date -d "$launch" +%s) ) / 60 ))
          if [ "$up_min" -lt "$COOLDOWN_MINUTES" ]; then
            echo "::warning::marts stale ${age_min} min but instance started only ${up_min} min ago (< ${COOLDOWN_MINUTES}m cooldown) -> giving it time to recover, no action."
            exit 0
          fi

          # Stale + running + past cooldown -> the wedge only a stop/start clears.
          echo "stop/starting ${INSTANCE_ID} (marts ${age_min} min stale, up ${up_min} min)"
          aws ec2 stop-instances  --instance-ids "$INSTANCE_ID" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          msg="marts-autorecover: stop/started ${INSTANCE_ID} (marts were ${age_min} min stale, box up ${up_min} min). A stop/start moves to fresh hardware and clears the network wedge; publishing should resume in ~10-15 min."
          if [ -n "${MARTS_ALERT_SLACK_WEBHOOK:-}" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"text\": \"${msg}\"}" "$MARTS_ALERT_SLACK_WEBHOOK" || true
          fi
          {
            echo "### marts-autorecover"
            echo "- Stop/started \`${INSTANCE_ID}\` (marts were **${age_min} min** stale, up ${up_min} min)"
            echo "- Stop/start (not reboot) clears the lost-route wedge; expect a fresh publish in ~10-15 min."
          } >> "$GITHUB_STEP_SUMMARY"

          # Exit non-zero so GitHub emails the owner that a recovery occurred.
          echo "::error::${msg}"
          exit 1
